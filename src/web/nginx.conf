# Hashed build assets never change; everything else must be revalidated so a
# new deploy (index.html, sw.js, manifest) reaches installed PWAs. API
# responses are never cached.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    root /usr/share/nginx/html;
    index index.html;

    # Declared only at server level: an add_header inside a location would
    # drop all of these for that location.
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite instead of append: clients must not choose the IP the API
        # uses for rate limiting and auditing.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
