name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: API, worker e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REMOTE_WAKE_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci-only
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Compilar (avisos são erros)
        run: dotnet build RemoteWake.slnx -c Release -warnaserror
      - name: Testes de unidade, API e migrações
        run: dotnet test --solution RemoteWake.slnx -c Release --no-build

  web:
    name: Interface web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Integração com Docker
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7
      - name: Validar os arquivos do Compose e a imagem web
        env:
          POSTGRES_PASSWORD: ci-only
          DOMAIN: remotewake.example.test
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.prod.yaml config -q
          docker compose build web
      - name: Gateway e agente em contêineres (sem ações reais)
        shell: pwsh
        run: ./scripts/Test-Integration.ps1
