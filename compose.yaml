name: remote-wake

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remotewake}
      POSTGRES_USER: ${POSTGRES_USER:-remotewake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=database;Port=5432;Database=${POSTGRES_DB:-remotewake};Username=${POSTGRES_USER:-remotewake};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Optional: fixed code for creating the first account. Without it, the API
      # prints a new code in its log while no account exists.
      Setup__Token: ${SETUP_TOKEN:-}
      Gateway__Key: ${GATEWAY_KEY:-}
      Gateway__OwnerEmail: ${GATEWAY_OWNER_EMAIL:-}
      Agent__MasterKey: ${AGENT_MASTER_KEY:-}
      Registration__Open: ${ALLOW_REGISTRATION:-false}
      # The API is reachable only from this Compose network (web/Caddy) and
      # from 127.0.0.1, so proxies on private networks may report the client
      # IP. Narrow this list if you expose the API port in another way.
      ForwardedHeaders__TrustedNetworks__0: 10.0.0.0/8
      ForwardedHeaders__TrustedNetworks__1: 172.16.0.0/12
      ForwardedHeaders__TrustedNetworks__2: 192.168.0.0/16
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8005}:80"

  gateway:
    profiles: ["gateway-linux"]
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      REMOTE_WAKE_MODE: gateway
      REMOTE_WAKE_API_URL: ${REMOTE_WAKE_API_URL:-http://127.0.0.1:8080/}
      REMOTE_WAKE_KEY: ${GATEWAY_KEY:-}
      REMOTE_WAKE_ALLOWED_BROADCASTS: ${GATEWAY_ALLOWED_BROADCASTS:-}

  # Demonstração sem hardware: o gateway só envia para o loopback do próprio
  # contêiner e o agente roda em simulação (nenhum PC é ligado ou desligado).
  demo-gateway:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    restart: on-failure:5
    depends_on:
      api:
        condition: service_healthy
    environment:
      REMOTE_WAKE_MODE: gateway
      REMOTE_WAKE_API_URL: http://api:8080/
      REMOTE_WAKE_KEY: ${GATEWAY_KEY:-}
      REMOTE_WAKE_ALLOWED_BROADCASTS: 127.0.0.1

  demo-agent:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    restart: on-failure:5
    depends_on:
      api:
        condition: service_healthy
    environment:
      REMOTE_WAKE_MODE: agent
      REMOTE_WAKE_API_URL: http://api:8080/
      REMOTE_WAKE_MACHINE_ID: ${DEMO_AGENT_MACHINE_ID:-}
      REMOTE_WAKE_KEY: ${DEMO_AGENT_KEY:-}
      REMOTE_WAKE_DRY_RUN: "true"

volumes:
  postgres-data:
