name: remote-wake

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remotewake}
      POSTGRES_USER: ${POSTGRES_USER:-remotewake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=database;Port=5432;Database=${POSTGRES_DB:-remotewake};Username=${POSTGRES_USER:-remotewake};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-RemoteWake}
      Jwt__Audience: ${JWT_AUDIENCE:-RemoteWake.Web}
      Gateway__Key: ${GATEWAY_KEY:-}
      Gateway__OwnerEmail: ${GATEWAY_OWNER_EMAIL:-}
      Agent__MasterKey: ${AGENT_MASTER_KEY:-}
      Registration__Open: ${ALLOW_REGISTRATION:-false}
      Cors__Origins__0: http://localhost:8005
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8005:80"

  gateway:
    profiles: ["gateway-linux"]
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      REMOTE_WAKE_MODE: gateway
      REMOTE_WAKE_API_URL: ${REMOTE_WAKE_API_URL:-http://127.0.0.1:8080/}
      REMOTE_WAKE_KEY: ${GATEWAY_KEY:-}
      REMOTE_WAKE_ALLOWED_BROADCASTS: ${GATEWAY_ALLOWED_BROADCASTS:-}

volumes:
  postgres-data:
